[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bootpy"
version = "0.1.0"
description = "Interactive Python project scaffolding CLI tool"
readme = "README.md"
authors = [
    { name = "Galan Jabal", email = "galanjabal@example.com" }
]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "typer>=0.9.0",
    "questionary>=2.0.1",
    "jinja2>=3.1.2",
    "rich>=13.5.2",
]

[project.scripts]
bootpy = "bootpy.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
