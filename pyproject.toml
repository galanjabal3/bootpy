[build-system]
requires = ["setuptools>=61.0.0,<68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bootpy-cli"
version = "0.3.0"
description = "Interactive Python project scaffolding CLI tool"
readme = "README.md"
authors = [
    { name = "Galan Jabal", email = "galanjabal3@users.noreply.github.com" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "typer>=0.9.0",
    "jinja2>=3.1.2",
    "rich>=13.5.2",
]

[project.scripts]
bootpy = "bootpy.cli:app"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
bootpy = ["templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
exclude = [".venv", "dist", "*.egg-info"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names, etc.)
    "I",   # isort (import order)
    "UP",  # pyupgrade (modern Python syntax)
]
ignore = [
    "E501",  # line too long — handled by formatter, not enforced strictly
]
