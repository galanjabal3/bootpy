[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bootpy"
version = "0.1.2"
description = "Interactive Python project scaffolding CLI tool"
readme = "README.md"
authors = [
    { name = "Galan Jabal", email = "70507032+galanjabal3@users.noreply.github.com" }
]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "typer>=0.9.0",
    "questionary>=2.0.1",
    "jinja2>=3.1.2",
    "rich>=13.5.2",
]

[project.scripts]
bootpy = "bootpy.cli:app"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
bootpy = ["templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
